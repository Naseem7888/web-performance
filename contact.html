<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHY Q - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="WHY Q LOGO.png" alt="WHY Q Logo" class="header-logo">
            <h1>WHY Q</h1>
        <!-- build:css css/site.min.css -->
        </div>
        <link rel="stylesheet" href="theme.css">
        <!-- endbuild -->
    </header>
    
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="team.html">Team</a>
        <a href="blog.html">Blog</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="faq.html">FAQ</a>
        <a href="policy.html">Policy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <main>
        <h2>Contact Us</h2>
        <p>We value your feedback. Reach out to us!</p>
        <form>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your Email">
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="How can we help?"></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 WHY Q. All rights reserved.</p>
    </footer>

    <!-- build:js js/site.min.js -->
    <script src="scripts/main.js"></script>
    <script src="scripts/performance.js"></script>
    <!-- endbuild -->
</body>
</html>
